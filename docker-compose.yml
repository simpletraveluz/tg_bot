services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bot_redis:/data

  bot:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  bot_redis:
